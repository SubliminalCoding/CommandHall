name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: zsh {0}

jobs:
  native-macos:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Swift toolchain
        run: swift --version

      - name: Test, release-compile, package, and smoke-test
        run: scripts/ci.sh

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-regression-failures
          path: Tests/VisualGoldens/Failures/
          if-no-files-found: ignore
          retention-days: 14
